<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Calculadora de Números</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <img src="https://upload.wikimedia.org/wikipedia/commons/7/7e/Bras%C3%A3o_Integralista_Fiel.png" alt="Logo" class="logo">
    <h1>Calculadora Matemática</h1>
    
</header>

<div class="container">

    <label>Primeiro Número:</label>
    <input type="number" id="num1">

    <label>Segundo Número:</label>
    <input type="number" id="num2">

    <button onclick="calcular()">Calcular</button>

    <div class="resultado">
        <p id="soma"></p>
        <p id="media"></p>
        <p id="produto"></p>
        <p id="maior"></p>
        <p id="menor"></p>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
